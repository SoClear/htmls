<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OMC Decoder/Encoder</title>
</head>
<body>
<p>OMC Decoder/Encoder</p>
<p>for Samsung cscfeature.xml</p>
<input type="file" id="fileInput" style="display: none">
<button onclick="isEncodeOperation=false; fileInput.click()">decode</button>
<button onclick="isEncodeOperation=true; fileInput.click()">encode</button>

<script>
  class OMC {
    static #shifts = new Uint8Array([
      1, 1, 0, 2, 2, 4, 5, 0, 4, 7, 1, 6, 5, 3, 3, 1, 2, 5, 0, 6, 2, 2, 4, 2, 2, 3, 0, 2, 1, 2, 4, 3,
      4, 0, 0, 0, 3, 5, 3, 1, 6, 5, 6, 1, 1, 1, 0, 0, 3, 2, 7, 7, 5, 6, 7, 3, 5, 1, 0, 7, 6, 3, 6, 5,
      4, 5, 3, 5, 1, 3, 3, 1, 5, 4, 1, 0, 0, 2, 6, 6, 6, 6, 4, 0, 1, 1, 0, 5, 5, 4, 2, 4, 6, 1, 7, 1,
      2, 1, 1, 6, 5, 4, 7, 6, 5, 1, 6, 7, 0, 2, 6, 3, 1, 7, 1, 1, 7, 4, 0, 4, 2, 5, 3, 1, 1, 5, 6, 0,
      3, 5, 3, 6, 5, 7, 2, 5, 6, 6, 2, 2, 3, 6, 0, 4, 3, 2, 0, 2, 2, 3, 5, 3, 3, 2, 5, 5, 5, 1, 3, 1,
      1, 1, 4, 5, 1, 6, 2, 4, 7, 1, 4, 6, 0, 6, 4, 3, 2, 6, 1, 6, 3, 2, 1, 6, 7, 3, 2, 1, 1, 5, 6, 7,
      2, 2, 2, 7, 4, 6, 7, 5, 3, 1, 4, 2, 7, 1, 6, 2, 4, 1, 5, 6, 5, 4, 5, 0, 1, 1, 6, 3, 7, 2, 0, 2,
      5, 0, 1, 3, 3, 2, 6, 7, 7, 2, 5, 6, 0, 4, 1, 2, 5, 3, 7, 6, 5, 2, 5, 2, 0, 1, 3, 1, 4, 3, 4, 2,
    ])

    static #salts = new Int8Array([
      65, -59, 33, -34, 107, 28, -107, 55, 78, 17, -81, 6, -80, -121, -35, -23, 72, 122, -63, -43, 68,
      119, -78, -111, -60, 31, 60, 57, 92, -88, -100, -69, -106, 91, 69, 93, 110, 23, 93, 53, -44, -51,
      64, -80, 46, 2, -4, 12, -45, 80, -44, -35, -111, -28, -66, -116, 39, 2, -27, -45, -52, 125, 39, 66,
      -90, 63, -105, -67, 84, -57, -4, -4, 101, -90, 81, 10, -33, 1, 67, -57, -71, 18, -74, 102, 96, -89,
      64, -17, 54, -94, -84, -66, 14, 119, 121, 2, -78, -79, 89, 63, 93, 109, -78, -51, 66, -36, 32, 86,
      3, -58, -15, 92, 58, 2, -89, -80, -13, -1, 122, -4, 48, 63, -44, 59, 100, -42, -45, 59, -7, -17, -54,
      34, -54, 71, -64, -26, -87, -80, -17, -44, -38, -112, 70, 10, -106, 95, -24, -4, -118, 45, -85, -13,
      85, 25, -102, -119, 13, -37, 116, 46, -69, 59, 42, -90, -38, -105, 101, -119, -36, 97, -3, -62, -91,
      -97, -125, 17, 14, 106, -72, -119, 99, 111, 20, 18, -27, 113, 64, -24, 74, -60, -100, 26, 56, -44,
      -70, 12, -51, -100, -32, -11, 26, 48, -117, 98, -93, 51, -25, -79, -31, 97, 87, -105, -64, 7, -13,
      -101, 33, -122, 5, -104, 89, -44, -117, 63, -80, -6, -71, -110, -29, -105, 116, 107, -93, 91, -41,
      -13, 20, -115, -78, 43, 79, -122, 6, 102, -32, 52, -118, -51, 72, -104, 41, -38, 124, 72, -126, -35
    ])

    /**
     * 解码字节数据
     * @param {Uint8Array} source - 输入的字节数组
     * @returns {Uint8Array} - 解码后的字节数组
     */
    static #decode(source) {
      // 预分配结果数组
      const result = new Uint8Array(source.length)

      // 直接在TypedArray上操作以提高性能
      for (let i = 0; i < source.length; i++) {
        // 位移操作
        const value = ((source[i] & 255) << this.#shifts[i % 256]) | ((source[i] & 255) >>> (8 - this.#shifts[i % 256]))
        // 异或操作
        result[i] = value ^ (this.#salts[i % 256] & 255)
      }

      return result
    }

    /**
     * 编码字节数据
     * @param {Uint8Array} source - 输入的字节数组
     * @returns {Uint8Array} - 编码后的字节数组
     */
    static #encode(source) {
      const result = new Uint8Array(source.length)

      for (let i = 0; i < source.length; i++) {
        // 先异或
        const value = source[i] ^ (this.#salts[i % 256] & 255)
        // 后位移
        result[i] = ((value & 255) >> this.#shifts[i % 256]) | ((value & 255) << (8 - this.#shifts[i % 256]))
      }

      return result
    }

    /**
     * GZIP解压缩
     * @param {Uint8Array} data - 压缩的数据
     * @returns {Promise<Uint8Array>} - 解压后的数据
     */
    static async #decompressGzip(data) {
      // 使用Web API的DecompressionStream
      const ds = new DecompressionStream('gzip')
      const decompressedStream = new Blob([data]).stream().pipeThrough(ds)

      return new Uint8Array(await new Response(decompressedStream).arrayBuffer())
    }

    /**
     * GZIP压缩
     * @param {Uint8Array} data - 原始数据
     * @returns {Promise<Uint8Array>} - 压缩后的数据
     */
    static async #compressGzip(data) {
      // 使用Web API的CompressionStream
      const cs = new CompressionStream('gzip')
      const compressedStream = new Blob([data]).stream().pipeThrough(cs)

      return new Uint8Array(await new Response(compressedStream).arrayBuffer())
    }

    /**
     * 检查文件是否是编码的XML
     * @param {Uint8Array} data - 文件内容
     * @returns {boolean}
     */
    static isXmlEncoded(data) {
      try {
        const decoder = new TextDecoder()
        const headerStr = decoder.decode(data.slice(0, 100))
        return !headerStr.includes('<?xml')
      } catch (e) {
        return false
      }
    }

    /**
     * 解码文件内容
     * @param {Uint8Array} fileContent - 文件内容
     * @returns {Promise<Uint8Array>} - 解码后的内容
     */
    static async decode(fileContent) {
      const decoded = this.#decode(fileContent)
      return await this.#decompressGzip(decoded)
    }

    /**
     * 编码文件内容
     * @param {Uint8Array} fileContent - 文件内容
     * @returns {Promise<Uint8Array>} - 编码后的内容
     */
    static async encode(fileContent) {
      const compressed = await this.#compressGzip(fileContent)
      return this.#encode(compressed)
    }
  }

  let isEncodeOperation = false
  const fileInput = document.getElementById('fileInput')

  // 当用户选择文件后自动处理
  fileInput.onchange = async (e) => {
    const file = e.target.files[0]
    if (!file) {
      return
    }
    try {
      const fileContent = new Uint8Array(await file.arrayBuffer())

      // 根据操作类型选择编码或解码
      const result = isEncodeOperation ? await OMC.encode(fileContent) : await OMC.decode(fileContent)

      // 创建并下载结果文件
      const blob = new Blob([result], { type: isEncodeOperation ? 'application/octet-stream' : 'text/xml' })
      const url = URL.createObjectURL(blob)
      const a = document.createElement('a')
      a.href = url
      a.download = (isEncodeOperation ? 'encoded_' : 'decoded_') + file.name
      a.click()

      // 清理URL
      setTimeout(() => URL.revokeObjectURL(url), 0)
    } catch (e) {
      console.error('处理失败:', e)
      alert('处理失败: ' + e.message)
    }
  }
</script>
</body>
</html>
